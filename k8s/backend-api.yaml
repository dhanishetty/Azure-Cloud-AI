apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sa-api
      containers:
        - name: backend-api
          image: azurecloudai12345.azurecr.io/backend-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
