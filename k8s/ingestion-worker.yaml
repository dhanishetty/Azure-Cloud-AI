apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: rag-app
spec:
  replicas: 1
  # One small node: replace the old pod instead of starting a second one next to it
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ingestion-worker
  template:
    metadata:
      labels:
        app: ingestion-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sa-worker
      containers:
        - name: ingestion-worker
          image: azurecloudai12345.azurecr.io/ingestion-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
